name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celld-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Celld
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Celld
        shell: bash
        env:
          CELLD_VERSION: ${{ vars.CELLD_VERSION }}
        run: |
          if [[ -z "$CELLD_VERSION" ]]; then
            echo "Set the CELLD_VERSION variable in the production GitHub Environment." >&2
            exit 1
          fi

          curl -fsSL https://celld.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          celld --version

      - name: Verify
        run: pnpm check

      - name: Write deployment environment
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is required." >&2
            exit 1
          fi

          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { parse } from "dotenv";

          const env = parse(readFileSync(".env"));
          const included = Object.keys(env).filter(
            (name) =>
              name.startsWith("CELLD_") ||
              name.startsWith("AWS_") ||
              name === "S3_ENDPOINT" ||
              name === "GOOGLE_APPLICATION_CREDENTIALS",
          );

          if (included.length > 0) {
            console.error(
              `Remove infrastructure settings from ENV_FILE and configure them through the production GitHub Environment: ${included.join(", ")}`,
            );
            process.exit(1);
          }
          NODE

      - name: Dry-run deployment
        env:
          CELLD_BUCKET: ${{ vars.CELLD_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          for name in CELLD_BUCKET AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name}" ]]; then
              printf 'Required production setting %s is missing.\n' "$name" >&2
              exit 1
            fi
          done

          pnpm deploy -- --dry-run

      - name: Deploy
        env:
          CELLD_BUCKET: ${{ vars.CELLD_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: pnpm deploy
