name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Hono API and static Waku
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Smoke test Waku dev server
        shell: bash
        run: |
          set -euo pipefail
          pnpm dev:web > /tmp/waku-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 35); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/ > /tmp/waku-home.html; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/waku-dev.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/waku-dev.log
            exit 1
          fi
          grep -q 'Celld' /tmp/waku-home.html
          curl -fsS --max-time 5 http://127.0.0.1:3000/rooms/drivers > /tmp/waku-room.html
          grep -q 'Celld' /tmp/waku-room.html
      - name: Verify Waku prerendered routes and RSC payloads
        run: |
          test -s dist/public/index.html
          test -s dist/public/rooms/drivers/index.html
          test -s dist/public/rooms/dispatch/index.html
          test -s dist/public/RSC/R/_root.txt
          test -s dist/public/RSC/R/rooms/drivers.txt
          test -s dist/public/RSC/R/rooms/dispatch.txt
