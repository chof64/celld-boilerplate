name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Hono API and optional React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - name: Verify Waku prerendered routes and RSC payloads
        run: |
          test -s dist/public/index.html
          test -s dist/public/rooms/drivers/index.html
          test -s dist/public/rooms/dispatch/index.html
          test -s dist/public/RSC/R/_root.txt
          test -s dist/public/RSC/R/rooms/drivers.txt
          test -s dist/public/RSC/R/rooms/dispatch.txt
          wc -c dist/public/index.html dist/public/rooms/drivers/index.html
          head -c 360 dist/public/index.html
          echo
      - name: Temporary pnpm lockfile snapshot
        run: |
          echo __BEGIN_CELLD_WAKU_LOCK__
          cat pnpm-lock.yaml
          echo __END_CELLD_WAKU_LOCK__
