name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Hono API and optional React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Temporary lockfile snapshot for PR sync
        run: |
          printf '%s\n' '__BEGIN_CELLD_LOCK_SYNC__'
          cat pnpm-lock.yaml
          printf '%s\n' '__END_CELLD_LOCK_SYNC__'
      - run: pnpm check
