<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A minimal chat app for testing Celld, Hono, Durable Objects, REST, and WebSockets."
    />
    <title>Celld Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="chat-card" aria-labelledby="app-title">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Celld + Hono</p>
            <h1 id="app-title">Chat test</h1>
          </div>
          <div class="connection" aria-live="polite">
            <span class="connection-dot" id="connection-dot"></span>
            <span id="connection-label">Connecting</span>
          </div>
        </header>

        <div class="controls">
          <label>
            <span>Name</span>
            <input
              id="user-name"
              maxlength="40"
              placeholder="Your name"
              autocomplete="nickname"
            />
          </label>
          <label>
            <span>Room</span>
            <div class="room-control">
              <input id="room-id" maxlength="128" value="lobby" />
              <button id="join-room" type="button">Join</button>
            </div>
          </label>
        </div>

        <div class="room-meta">
          <span>Room</span>
          <strong id="room-label">lobby</strong>
        </div>

        <div class="messages" id="messages" aria-live="polite"></div>

        <form class="composer" id="message-form">
          <input
            id="message-text"
            maxlength="2000"
            placeholder="Type a message"
            autocomplete="off"
          />
          <button type="submit">Send</button>
        </form>

        <p class="error" id="error-message" role="alert"></p>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
